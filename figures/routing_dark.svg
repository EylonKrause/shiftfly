<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" role="img" aria-label="Shift routing"><title>Shift routing</title><rect width="820" height="430" fill="#1a1a19"/><text x="38.00" y="42.00" fill="#ffffff" font-size="19" font-weight="600" text-anchor="start" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>Routing is a shift register, not a table</text><text x="38.00" y="66.00" fill="#c3c2b7" font-size="12.5" font-weight="400" text-anchor="start" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>The Kautz graph K(2,2). To reach v, shift its symbols in from the right; the destination label is the route.</text><line x1="260.00" y1="151.32" x2="339.46" y2="288.95" stroke="#898781" stroke-width="1.1" opacity="0.45"/><path d="M339.5,288.9 L331.1,283.4 L338.9,278.9 Z" fill="#898781" opacity="0.45"/><line x1="333.14" y1="202.00" x2="168.59" y2="297.00" stroke="#898781" stroke-width="1.1" opacity="0.45"/><path d="M168.6,297.0 L174.1,288.6 L178.6,296.4 Z" fill="#898781" opacity="0.45"/><line x1="330.46" y1="192.00" x2="171.54" y2="192.00" stroke="#898781" stroke-width="1.1" opacity="0.45"/><path d="M171.5,192.0 L180.5,187.5 L180.5,196.5 Z" fill="#898781" opacity="0.45"/><line x1="340.46" y1="290.68" x2="261.00" y2="153.05" stroke="#898781" stroke-width="1.1" opacity="0.45"/><path d="M261.0,153.1 L269.4,158.6 L261.6,163.1 Z" fill="#898781" opacity="0.45"/><line x1="350.46" y1="288.00" x2="350.46" y2="214.00" stroke="#898781" stroke-width="1.1" opacity="0.45"/><path d="M350.5,214.0 L355.0,223.0 L346.0,223.0 Z" fill="#898781" opacity="0.45"/><line x1="240.00" y1="348.68" x2="160.54" y2="211.05" stroke="#898781" stroke-width="1.1" opacity="0.45"/><path d="M160.5,211.1 L168.9,216.6 L161.1,221.1 Z" fill="#898781" opacity="0.45"/><line x1="159.54" y1="290.68" x2="239.00" y2="153.05" stroke="#898781" stroke-width="1.1" opacity="0.45"/><path d="M239.0,153.1 L238.4,163.1 L230.6,158.6 Z" fill="#898781" opacity="0.45"/><line x1="166.86" y1="298.00" x2="331.41" y2="203.00" stroke="#898781" stroke-width="1.1" opacity="0.45"/><path d="M331.4,203.0 L325.9,211.4 L321.4,203.6 Z" fill="#898781" opacity="0.45"/><line x1="166.86" y1="202.00" x2="331.41" y2="297.00" stroke="#898781" stroke-width="1.1" opacity="0.45"/><path d="M331.4,297.0 L321.4,296.4 L325.9,288.6 Z" fill="#898781" opacity="0.45"/><line x1="159.54" y1="209.32" x2="239.00" y2="346.95" stroke="#898781" stroke-width="1.1" opacity="0.45"/><path d="M239.0,346.9 L230.6,341.4 L238.4,336.9 Z" fill="#898781" opacity="0.45"/><line x1="250.00" y1="154.00" x2="250.00" y2="344.00" stroke="#d95926" stroke-width="2.6" opacity="1.0"/><path d="M250.0,344.0 L245.5,335.0 L254.5,335.0 Z" fill="#d95926" opacity="1.0"/><line x1="232.68" y1="356.00" x2="168.59" y2="319.00" stroke="#d95926" stroke-width="2.6" opacity="1.0"/><path d="M168.6,319.0 L178.6,319.6 L174.1,327.4 Z" fill="#d95926" opacity="1.0"/><circle cx="250.0" cy="134.0" r="19" fill="#d95926" stroke="#d95926" stroke-width="2"/><text x="250.00" y="138.50" fill="#1a1a19" font-size="12.5" font-weight="600" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>01</text><circle cx="350.5" cy="192.0" r="19" fill="#1a1a19" stroke="#383835" stroke-width="2"/><text x="350.46" y="196.50" fill="#c3c2b7" font-size="12.5" font-weight="600" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>02</text><circle cx="350.5" cy="308.0" r="19" fill="#1a1a19" stroke="#383835" stroke-width="2"/><text x="350.46" y="312.50" fill="#c3c2b7" font-size="12.5" font-weight="600" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>10</text><circle cx="250.0" cy="366.0" r="19" fill="#d95926" stroke="#d95926" stroke-width="2"/><text x="250.00" y="370.50" fill="#1a1a19" font-size="12.5" font-weight="600" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>12</text><circle cx="149.5" cy="308.0" r="19" fill="#d95926" stroke="#d95926" stroke-width="2"/><text x="149.54" y="312.50" fill="#1a1a19" font-size="12.5" font-weight="600" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>20</text><circle cx="149.5" cy="192.0" r="19" fill="#1a1a19" stroke="#383835" stroke-width="2"/><text x="149.54" y="196.50" fill="#c3c2b7" font-size="12.5" font-weight="600" text-anchor="middle" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>21</text><text x="452.00" y="132.00" fill="#ffffff" font-size="13" font-weight="600" text-anchor="start" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>Worked example:  01 → 20</text><text x="452.00" y="164.00" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>Longest suffix of u that is a</text><text x="452.00" y="185.00" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>prefix of v:  ℓ = 0, so k = D − ℓ = 2 hops.</text><text x="452.00" y="206.00" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'></text><text x="452.00" y="227.00" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>step 1:   u[1:] + v[0:1]  =  1 + 2  =  12</text><text x="452.00" y="248.00" fill="#c3c2b7" font-size="12" font-weight="400" text-anchor="start" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>step 2:   u[2:] + v[0:2]  =  ε + 20  =  20</text><text x="452.00" y="269.00" fill="#898781" font-size="12" font-weight="400" text-anchor="start" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'></text><text x="452.00" y="290.00" fill="#898781" font-size="12" font-weight="400" text-anchor="start" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>No table is consulted. No protocol</text><text x="452.00" y="311.00" fill="#898781" font-size="12" font-weight="400" text-anchor="start" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>converges. The label is the route.</text><text x="452.00" y="366.00" fill="#ffffff" font-size="12.5" font-weight="600" text-anchor="start" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>Merge criterion</text><text x="452.00" y="388.00" fill="#898781" font-size="11.5" font-weight="400" text-anchor="start" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>Two sources routing to the same v meet at step k</text><text x="452.00" y="406.00" fill="#898781" font-size="11.5" font-weight="400" text-anchor="start" font-family='system-ui, -apple-system, "Segoe UI", sans-serif'>iff their last D − k symbols agree.</text></svg>